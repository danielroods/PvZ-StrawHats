plugins {
    id 'application'
    id 'checkstyle'
}

checkstyle {
    toolVersion = '10.18.2'
    configFile = file("config/checkstyle/checkstyle.xml")
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

def gdxVersion = "1.13.1"

dependencies {
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

    implementation 'com.github.pizpizi:pvz-skin:v0.1.0'
    implementation 'com.github.raeleus.TenPatch:tenpatch:5.2.3'
    implementation 'com.github.pizpizi:libPVZ:v0.1.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['assets']
        }
    }
    // Kept out of src/ on purpose: src/ is the main source root, so anything under it
    // would be compiled into main (without the test dependencies on the classpath).
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = ['assets']
        }
    }
}

application {
    mainClass = 'DesktopLauncher'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'DesktopLauncher',
                'Class-Path': configurations.runtimeClasspath.files
                        .collect { it.name }
                        .join(' ')
        )
    }
}

tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Runs the Plants vs Zombies multiplayer server.'
    mainClass = 'net.server.ServerLauncher'
    classpath = sourceSets.main.runtimeClasspath
    args '--port', '7777', '--data', 'server-data'
}

run {
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        def iconFile = file('assets/images/ui/icon.png')

        if (iconFile.exists()) {
            jvmArgs '-XstartOnFirstThread',
                    "-Xdock:icon=${iconFile.absolutePath}",
                    '-Xdock:name=Plants vs Zombies'
        } else {
            jvmArgs '-XstartOnFirstThread',
                    '-Xdock:name=Plants vs Zombies'
        }
    }
}